location = /pwa/manifest.webmanifest {
    alias /home/valuasi-oto/valapp/pwa/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    alias /home/valuasi-oto/valapp/pwa/sw.js;
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache" always;
}

location = /activate {
    alias /home/valuasi-oto/valapp/pwa/activate.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /license/activate {
    access_log off;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 4k;
}

location = /license/logout {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /pwa/ {
    alias /home/valuasi-oto/valapp/pwa/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}
